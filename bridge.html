<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Studio sync</title>
<style>body{margin:0;padding:22px;font:15px/1.4 system-ui,-apple-system,sans-serif;background:#111113;color:#eee}h3{margin:0 0 8px;color:#f0997b}</style>
</head><body>
<h3>Art Studio sync</h3><p id="s">Waiting for Instagram / YouTube…</p>
<script>
// Relay: Instagram/YouTube pages can't talk to the Art Studio backend directly (their security rules block it),
// so the sync script opens this page on the app's own site and hands it the saved items to forward.
const url = localStorage.getItem('studio.url'), key = localStorage.getItem('studio.key');
const allowed = /^https:\/\/www\.(instagram|youtube)\.com$/;
const say = t => { document.getElementById('s').textContent = t; };
let total = 0;
addEventListener('message', async e => {
  if (!allowed.test(e.origin) || !e.data || e.data.type !== 'art-import') return;
  const d = e.data;
  try {
    if (!url || !key) throw new Error('Open the Art Studio app once in this browser first');
    say('Sending ' + d.items.length + ' from ' + d.folder + '…');
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key, action: 'importSaved', source: d.source, folder: d.folder, items: d.items }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'backend error');
    total += j.added || 0;
    e.source.postMessage({ type: 'art-result', id: d.id, ok: true, added: j.added, pictures: j.pictures, remove: j.remove || [], need: j.need || [] }, e.origin);
    say(d.folder + ': ' + total + ' new so far');
  } catch (err) {
    e.source.postMessage({ type: 'art-result', id: d.id, ok: false, error: String(err.message || err) }, e.origin);
    say('Problem: ' + (err.message || err));
  }
});
if (window.opener) window.opener.postMessage({ type: 'art-ready' }, '*');
</script>
</body></html>
